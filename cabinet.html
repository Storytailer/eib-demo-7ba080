<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личный кабинет · ЭИБ Обнинск</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2312275C'/%3E%3Cg fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M24 6 39 14.5v17L24 40 9 31.5v-17z' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M15 28v6.5a2.4 2.4 0 0 0 2.4 2.4h13.2a2.4 2.4 0 0 0 2.4-2.4V28' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M15 28h4M29 28h4' stroke='%23ffffff' stroke-width='2'/%3E%3Cg transform='rotate(-16 24 19)'%3E%3Crect x='20' y='11' width='8.4' height='16' rx='1.4' fill='%23ffffff'/%3E%3Cpath d='m21.9 19 2.1 2.2 4-5.4' stroke='%23E32C26' stroke-width='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="hdr"></div>

<section class="pagehead"><div class="wrap" id="head"></div></section>
<section class="sec"><div class="wrap" id="body"></div></section>

<div id="ftr"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
mount('cabinet');

const r = State.role();
const acc = State.account();
const all = projects();
const head = document.getElementById('head');
const body = document.getElementById('body');

/* ---------- Гость ---------- */
if (!acc) {
  head.innerHTML = `<div class="crumbs"><a href="index.html">Главная</a> → Личный кабинет</div>
    <h2>Войдите, чтобы открыть кабинет</h2>
    <p class="lead mt8">Кабинет собирает то, что касается лично вас: ваши инициативы и взносы,
      очередь задач администрации или контракты подрядчика.</p>`;
  body.innerHTML = `<div class="card" style="text-align:center;padding:60px 26px">
      <h3 class="mb14">Вход через Госуслуги или ведомственную учётную запись</h3>
      <p class="lead mb28">Демо-режим: пароль не нужен, роль можно переключать сколько угодно раз.</p>
      <a class="btn btn-p btn-l" href="login.html">Выбрать роль и войти</a>
    </div>`;
} else {

/* ---------- Общая шапка кабинета ---------- */
head.innerHTML = `<div class="crumbs"><a href="index.html">Главная</a> → Личный кабинет</div>
  <div class="between">
    <div>
      <span class="eyebrow">${ROLE_LABEL[r]} · ${CITY.name}</span>
      <h2 class="mt8">${acc.name}</h2>
      <p class="lead mt8">${acc.org} · ${acc.esia}</p>
    </div>
    <div class="flexr">
      ${r === 'citizen' ? '<a class="btn btn-p" href="submit.html">Подать инициативу</a>' : ''}
      <a class="btn btn-o" href="projects.html">Все проекты города</a>
    </div>
  </div>`;

/* ---------- Помощники ---------- */
const kpi = (arr) => `<div class="grid g4 mb28">${arr.map(k =>
  `<div class="kpi ${k[2] || 'b'}"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div>`;

const task = (icon, cls, title, sub, btn, href) => `<div class="doc">
  <span class="ic ${cls}">${icon}</span>
  <div class="tx"><b>${title}</b><small>${sub}</small></div>
  <div class="act"><a class="btn btn-o btn-s" href="${href}">${btn}</a></div></div>`;

const row = p => `<tr>
  <td><b><a href="project.html?id=${p.id}">${p.title}</a></b><br><small class="muted">${p.district} · ${p.cat}</small></td>
  <td><span class="chip ${stage(p.stage).chip}">${stage(p.stage).name}</span></td>
  <td class="r">${rub(p.cost)}</td>`;

/* ---------- ЖИТЕЛЬ ---------- */
if (r === 'citizen') {
  const mine = all.filter(p => ['skver-uchenyh', 'lestnica-belkino'].includes(p.id));
  const donations = [
    { id: 'skver-uchenyh', d: '12.09.2026', sum: 2000 },
    { id: 'ploschadka-aksenova', d: '05.08.2026', sum: 1500 },
    { id: 'shkola7-sport', d: '14.04.2026', sum: 1000 }
  ];
  const sum = donations.reduce((s, x) => s + x.sum, 0);

  body.innerHTML = kpi([
    [mine.length, plural(mine.length, 'ваша инициатива', 'ваши инициативы', 'ваших инициатив') + ' в работе', 'b'],
    [rub(sum), 'вы вложили в проекты города', 'g'],
    ['5', 'заявок вы подписали через ЕСИА', 'v'],
    ['1', 'проект с вашим взносом уже открыт', 'a']
  ]) + `
  <div class="grid g2" style="align-items:start">
    <div>
      <div class="card">
        <div class="card-h"><h3>Требуют вашего действия</h3><span class="chip chip-amber">3 задачи</span></div>
        ${task('✍️', 'wait', 'Не хватает 2 подписей', 'Лестница к парку «Белкино» — 8 из 10 подписей группы', 'Подписать', 'project.html?id=lestnica-belkino')}
        ${task('💳', '', 'До конца сбора 19 дней', 'Сквер у Дома учёных — осталось собрать ' + rub(left(all.find(p => p.id === 'skver-uchenyh'))), 'Поддержать', 'project.html?id=skver-uchenyh')}
        ${task('📸', 'ok', 'Новый фотоотчёт подрядчика', 'Воркаут-площадка в Заовражье — выполнение 64%', 'Смотреть', 'project.html?id=vorkaut-zaovrazhye')}
      </div>
      <div class="card">
        <div class="card-h"><h3>Мои инициативы</h3><span class="chip chip-grey">${mine.length}</span></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Проект</th><th>Этап</th><th class="r">Смета</th><th class="r">Готовность</th></tr></thead>
          <tbody>${mine.map(p => row(p) + `<td class="r" style="min-width:120px">
            <div class="bar ${pct(p) >= 100 ? 'ok' : 'warn'}"><i style="width:${p.stage === 'idea' ? Math.round(p.signatures.count / p.signatures.need * 100) : pct(p)}%"></i></div>
            <small class="muted">${p.stage === 'idea' ? p.signatures.count + ' из ' + p.signatures.need + ' подписей' : pct(p) + '% сбора'}</small></td></tr>`).join('')}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-h"><h3>Мои взносы и документы</h3><span class="chip chip-green">${rub(sum)}</span></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Проект</th><th>Дата</th><th class="r">Сумма</th><th>Документы</th></tr></thead>
          <tbody>${donations.map(d => {
            const p = all.find(x => x.id === d.id);
            return `<tr><td><b><a href="project.html?id=${p.id}">${p.title}</a></b></td><td>${d.d}</td>
              <td class="r strong">${rub(d.sum)}</td>
              <td><button class="btn btn-o btn-s" onclick="toast('Демо: открылся бы договор пожертвования и чек')">Договор и чек</button></td></tr>`;
          }).join('')}</tbody>
        </table></div>
        <div class="note note-g mt20">По проекту «Спортивная площадка у школы № 7» вам вернули излишек взноса
          после экономии на торгах — возврат пришёл на карту, с которой был платёж (ст. 70 ФЗ-33).</div>
      </div>
    </div>
    <div>
      <div class="card">
        <h3 class="mb14">Ваш вклад в город</h3>
        <div class="facts">
          <div><span>Проектов поддержано</span><b>3</b></div>
          <div><span>Всего внесено</span><b>${rub(sum)}</b></div>
          <div><span>Возвращено излишков</span><b>${rub(120)}</b></div>
          <div><span>Подписей поставлено</span><b>5</b></div>
        </div>
        <a class="btn btn-p btn-full mt20" href="projects.html?f=collecting">Поддержать ещё один проект</a>
      </div>
      <div class="card">
        <h3 class="mb14">Уведомления</h3>
        <div class="doc"><span class="ic ok">✓</span><div class="tx"><b>Смета утверждена</b><small>02.09.2026 · Сквер у Дома учёных</small></div></div>
        <div class="doc"><span class="ic">⚙️</span><div class="tx"><b>Сбор идёт: 73%</b><small>05.10.2026 · осталось 19 дней</small></div></div>
        <div class="doc"><span class="ic wait">📨</span><div class="tx"><b>Пакет документов отправлен</b><small>30.09.2026 · Детская площадка на ул. Аксёнова</small></div></div>
      </div>
    </div>
  </div>`;
}

/* ---------- АДМИНИСТРАЦИЯ ---------- */
if (r === 'admin') {
  const byStage = k => all.filter(p => p.stage === k);
  const inCollect = byStage('collecting');
  const raised = all.reduce((s, p) => s + p.raised, 0);

  body.innerHTML = kpi([
    [byStage('idea').length, plural(byStage('idea').length, 'заявка ждёт', 'заявки ждут', 'заявок ждут') + ' отбора комиссии', 'v'],
    [inCollect.length, plural(inCollect.length, 'проект', 'проекта', 'проектов') + ' в сборе средств', 'b'],
    [byStage('documents').length, plural(byStage('documents').length, 'пакет документов', 'пакета документов', 'пакетов документов') + ' на проверке', 'a'],
    [byStage('works').length + byStage('contractor').length, plural(byStage('works').length + byStage('contractor').length, 'проект', 'проекта', 'проектов') + ' в закупке и работах', 'g']
  ]) + `
  <div class="grid g2" style="align-items:start">
    <div>
      <div class="card">
        <div class="card-h"><h3>Очередь задач куратора</h3><span class="chip chip-amber">по срокам</span></div>
        ${byStage('documents').map(p => task('📨', 'wait', 'Принять пакет документов', p.title + ' · ' + p.docsPack.incoming + ' · ' + p.docsPack.deadline, 'Открыть', 'project.html?id=' + p.id)).join('')}
        ${byStage('contractor').map(p => task('📑', 'wait', 'Подписать протокол и контракт', p.title + ' · закупка № ' + p.tender.number, 'Открыть', 'project.html?id=' + p.id)).join('')}
        ${byStage('works').map(p => task('🏗️', '', 'Принять акт КС-2 по этапу', p.title + ' · выполнение ' + p.works.progress + '% · сдача ' + p.works.finish, 'Открыть', 'project.html?id=' + p.id)).join('')}
        ${byStage('idea').map(p => task('📝', '', 'Проверить смету и вынести на комиссию', p.title + ' · смета ' + rub(p.cost) + ' · подписей ' + p.signatures.count + '/' + p.signatures.need, 'Открыть', 'project.html?id=' + p.id)).join('')}
      </div>

      <div class="card">
        <div class="card-h"><h3>Контроль сбора средств</h3><span class="chip chip-blue">п. 8.2 · 40 рабочих дней</span></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Проект</th><th class="r">Цель</th><th class="r">Собрано</th><th class="r">Осталось</th><th>Срок</th></tr></thead>
          <tbody>${inCollect.map(p => `<tr>
            <td><b><a href="project.html?id=${p.id}">${p.title}</a></b><br>
              <div class="bar ${pct(p) >= 100 ? 'ok' : 'warn'}" style="margin-top:6px;max-width:200px"><i style="width:${pct(p)}%"></i></div></td>
            <td class="r">${rub(p.goal)}</td><td class="r strong">${rub(p.raised)}</td>
            <td class="r" style="color:var(--red);font-weight:800">${rub(left(p))}</td>
            <td>${p.deadline}<br><small class="muted">${p.daysLeft ? days(p.daysLeft) : ''}</small></td></tr>`).join('')}</tbody>
        </table></div>
        <div class="note note-a mt20"><b>Зачем это администрации.</b> Раньше о недоборе становилось известно
          в последний день срока по договору — и проект приходилось расторгать. Здесь остаток и темп сбора
          видны ежедневно, а платформа шлёт напоминания инициатору и жителям.</div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Реестр проектов 2026 года</h3><span class="chip chip-grey">${all.length}</span></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Проект</th><th>Этап</th><th class="r">Смета</th><th class="r">Доля жителей</th><th>Инициатор</th></tr></thead>
          <tbody>${all.map(p => row(p) + `<td class="r">${rub(p.goal)}</td><td>${p.initiator.name}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h3 class="mb14">Сводка по городу</h3>
        <div class="facts">
          <div><span>Проектов в реестре</span><b>${all.length}</b></div>
          <div><span>Собрано жителями</span><b>${rub(raised)}</b></div>
          <div><span>Электронных подписей</span><b>${all.reduce((s, p) => s + p.signatures.count, 0)}</b></div>
          <div><span>Плательщиков</span><b>${all.reduce((s, p) => s + p.donors, 0)}</b></div>
          <div><span>Лимит одного проекта</span><b>${rub(CITY.limit)}</b></div>
        </div>
        <button class="btn btn-d btn-full mt20" onclick="toast('Демо: выгружен пакет XLSX для отчётности в Минфин области')">Выгрузить отчётность</button>
      </div>
      <div class="card">
        <h3 class="mb14">Документы на подпись</h3>
        <div class="doc"><span class="ic wait">📑</span><div class="tx"><b>Протокол рассмотрения заявок</b><small>Тротуар по ул. Курчатова</small></div></div>
        <div class="doc"><span class="ic wait">🧾</span><div class="tx"><b>Акт КС-2 № 2</b><small>Воркаут-площадка в Заовражье</small></div></div>
        <div class="doc"><span class="ic ok">✓</span><div class="tx"><b>Итоговый отчёт опубликован</b><small>Спортплощадка у школы № 7</small></div></div>
      </div>
      <div class="card">
        <h3 class="mb14">Что уходит в область</h3>
        <p class="muted" style="font-size:14px">Платформа собирает данные для отчёта в Минфин Калужской области:
          число проектов, доля софинансирования жителей, сроки и итоговые отчёты — без ручного сведения таблиц.</p>
      </div>
    </div>
  </div>`;
}

/* ---------- ПОДРЯДЧИК ---------- */
if (r === 'contractor') {
  const me = 'ООО «СпортСтройМонтаж»';
  const mine = all.filter(p => p.works && p.works.contractor === me);
  const open = all.filter(p => p.tender && p.stage === 'contractor');
  const active = mine.filter(p => p.stage === 'works');
  const sum = mine.reduce((s, p) => s + p.works.sum, 0);
  const issues = active.reduce((s, p) => s + p.works.issues.length, 0);

  body.innerHTML = kpi([
    [mine.length, plural(mine.length, 'муниципальный контракт', 'муниципальных контракта', 'муниципальных контрактов') + ' на платформе', 'b'],
    [rub(sum), 'общая цена контрактов', 'g'],
    [active.length ? active[0].works.finish : '—', 'ближайшая сдача объекта', 'a'],
    [issues, plural(issues, 'замечание', 'замечания', 'замечаний') + ' от жителей и инспекторов', 'r']
  ]) + `
  <div class="grid g2" style="align-items:start">
    <div>
      <div class="card">
        <div class="card-h"><h3>Мои контракты</h3><span class="chip chip-grey">${mine.length}</span></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Объект</th><th>Контракт</th><th class="r">Цена</th><th class="r">Готовность</th><th>Сдача</th></tr></thead>
          <tbody>${mine.map(p => `<tr>
            <td><b><a href="project.html?id=${p.id}">${p.title}</a></b><br><small class="muted">${p.district}</small></td>
            <td>${p.works.contract}</td>
            <td class="r strong">${rub(p.works.sum)}</td>
            <td class="r" style="min-width:120px"><div class="bar ${p.works.progress === 100 ? 'ok' : 'warn'}"><i style="width:${p.works.progress}%"></i></div>
              <small class="muted">${p.works.progress}%</small></td>
            <td>${p.works.finish}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>

      ${active.map(p => `<div class="card">
        <div class="card-h"><h3>Что нужно сделать: ${p.title}</h3><span class="chip chip-amber">${p.works.progress}%</span></div>
        ${task('📸', 'wait', 'Опубликовать фотоотчёт по этапу', p.works.plan.find(x => x.st === 'now') ? p.works.plan.find(x => x.st === 'now').t : 'текущий этап', 'Открыть', 'project.html?id=' + p.id)}
        ${task('✅', '', 'Закрыть выполненный этап графика', 'Платформа пересчитает готовность и уведомит куратора', 'Открыть', 'project.html?id=' + p.id)}
        ${p.works.issues.map(i => task('⚠️', 'wait', 'Замечание: ' + i.t, i.d + ' · ' + i.who + ' · ' + i.st, 'Ответить', 'project.html?id=' + p.id)).join('')}
      </div>`).join('')}

      <div class="card">
        <div class="card-h"><h3>Открытые закупки города</h3><span class="chip chip-blue">44-ФЗ</span></div>
        ${open.length ? `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Объект</th><th>Извещение</th><th class="r">НМЦК</th><th>Заявки до</th><th></th></tr></thead>
          <tbody>${open.map(p => `<tr>
            <td><b><a href="project.html?id=${p.id}">${p.title}</a></b></td>
            <td>${p.tender.number}</td><td class="r strong">${rub(p.tender.nmck)}</td><td>${p.tender.bidsUntil}</td>
            <td class="r"><button class="btn btn-o btn-s" onclick="toast('Демо: переход в ЕИС для подачи заявки')">Подать заявку</button></td>
          </tr>`).join('')}</tbody></table></div>`
          : '<p class="muted">Открытых закупок по инициативным проектам сейчас нет.</p>'}
        <div class="note note-b mt20">Заявки подаются в ЕИС по 44-ФЗ — платформа не подменяет торги.
          Здесь подрядчик видит объекты, сроки и то, что жители уже вложили в них свои деньги.</div>
      </div>
    </div>

    <div>
      <div class="card">
        <h3 class="mb14">Репутация на платформе</h3>
        <div class="facts">
          <div><span>Исполнено контрактов</span><b>21</b></div>
          <div><span>Срывов срока</span><b>0</b></div>
          <div><span>Средняя оценка жителей</span><b>4,8 из 5</b></div>
          <div><span>Замечаний устранено</span><b>12 из 12</b></div>
        </div>
        <div class="note note-g mt20">Репутация видна жителям в карточке закупки. Это ответ на вопрос
          «кто будет делать наш проект» — не только цена, но и история работ.</div>
      </div>
      <div class="card">
        <h3 class="mb14">Ближайшие сроки</h3>
        <div class="doc"><span class="ic wait">📅</span><div class="tx"><b>07.10.2026 — укладка покрытия</b><small>Воркаут-площадка в Заовражье</small></div></div>
        <div class="doc"><span class="ic">📅</span><div class="tx"><b>13.10.2026 — электромонтаж</b><small>Воркаут-площадка в Заовражье</small></div></div>
        <div class="doc"><span class="ic ok">📅</span><div class="tx"><b>18.10.2026 — сдача объекта</b><small>Приёмка с общественными инспекторами</small></div></div>
      </div>
    </div>
  </div>`;
}

}
</script>
</body>
</html>
