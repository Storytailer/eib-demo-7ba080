<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личный кабинет · ЭИБ Обнинск</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2312275C'/%3E%3Cg fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M24 6 39 14.5v17L24 40 9 31.5v-17z' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M15 28v6.5a2.4 2.4 0 0 0 2.4 2.4h13.2a2.4 2.4 0 0 0 2.4-2.4V28' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M15 28h4M29 28h4' stroke='%23ffffff' stroke-width='2'/%3E%3Cg transform='rotate(-16 24 19)'%3E%3Crect x='20' y='11' width='8.4' height='16' rx='1.4' fill='%23ffffff'/%3E%3Cpath d='m21.9 19 2.1 2.2 4-5.4' stroke='%23E32C26' stroke-width='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="hdr"></div>

<section class="pagehead"><div class="wrap" id="head"></div></section>
<section class="sec"><div class="wrap" id="body"></div></section>

<div id="ftr"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>
<script>
mount('cabinet');

const acc = Session.user;
const head = document.getElementById('head');
const body = document.getElementById('body');

const kpi = arr => `<div class="grid g4 mb28">${arr.map(k =>
  `<div class="kpi ${k[2] || 'b'}"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div>`;

const task = (icon, cls, title, sub, btn, href) => `<div class="doc">
  <span class="ic ${cls}">${icon}</span>
  <div class="tx"><b>${title}</b><small>${sub}</small></div>
  <div class="act"><a class="btn btn-o btn-s" href="${href}">${btn}</a></div></div>`;

const plink = p => `<a href="project.html?id=${p.id}">${esc(p.title)}</a>`;
const chip = p => `<span class="chip ${statusOf(p).chip}">${statusOf(p).n}</span>`;

/* ---------------- Гость ---------------- */
if (!acc) {
  head.innerHTML = `<div class="crumbs"><a href="index.html">Главная</a> → Личный кабинет</div>
    <h2>Войдите, чтобы открыть кабинет</h2>
    <p class="lead mt8">Кабинет собирает то, что касается лично вас: ваши проекты и черновики,
      подписи и взносы, история просмотров — или очередь заявок администрации и контракты подрядчика.</p>`;
  body.innerHTML = `<div class="card" style="text-align:center;padding:60px 26px">
      <h3 class="mb14">Вход через Госуслуги или ведомственную учётную запись</h3>
      <p class="lead mb28">Демо-режим: пароль не нужен, роль можно переключать сколько угодно раз.</p>
      <a class="btn btn-p btn-l" href="login.html">Выбрать роль и войти</a>
    </div>`;
} else {

head.innerHTML = `<div class="crumbs"><a href="index.html">Главная</a> → Личный кабинет</div>
  <div class="between">
    <div>
      <span class="eyebrow">${ROLE_LABEL[acc.role]} · ${CITY.name}</span>
      <h2 class="mt8">${esc(acc.full || acc.name)}</h2>
      <p class="lead mt8">${esc(acc.org)}${acc.esia ? ' · ' + esc(acc.esia) : ''}</p>
    </div>
    <div class="flexr">
      ${acc.role === 'citizen' ? '<a class="btn btn-p" href="create.html">Предложить проект</a>' : ''}
      ${acc.role === 'admin' ? '<a class="btn btn-p" href="create.html">Создать проект от администрации</a>' : ''}
      ${acc.role === 'contractor' ? '<a class="btn btn-p" href="create.html">Предложить проект</a>' : ''}
      ${acc.role === 'contractor' ? '<a class="btn btn-o" href="tender.html">Открытые торги</a>' : ''}
      <a class="btn btn-o" href="projects.html">Все проекты города</a>
    </div>
  </div>`;

/* ================= ЖИТЕЛЬ ================= */
if (acc.role === 'citizen') {
  const mine = DB.projects({ owner: acc.id });
  const myTx = DB.txByUser(acc.id);
  const paid = myTx.filter(t => t.status === 'confirmed').reduce((s, t) => s + t.amount, 0);
  const refunded = myTx.filter(t => t.status === 'refunded').reduce((s, t) => s + t.amount, 0);
  const mySigns = DB.signaturesByUser(acc.id);
  const signedProjects = mySigns.map(s => DB.project(s.projectId)).filter(Boolean);
  const paidProjects = [...new Set(myTx.filter(t => t.status === 'confirmed').map(t => t.projectId))]
    .map(pid => DB.project(pid)).filter(Boolean);
  const supported = [...new Set(signedProjects.concat(paidProjects))];
  const views = DB.viewsByUser(acc.id);
  const myIssues = DB.all('issues').filter(i => i.userId === acc.id);

  /* задачи */
  const tasks = [];
  mine.filter(p => p.status === 'draft').forEach(p => tasks.push(
    task('✎', 'wait', 'Черновик не отправлен', esc(p.title) + ' — продолжите заполнение и отправьте заявку', 'Продолжить', 'create.html?id=' + p.id)));
  mine.filter(p => p.status === 'rework').forEach(p => tasks.push(
    task('↩', 'wait', 'Заявка возвращена на доработку', esc(p.title) + ' — ' + esc(p.adminComment || 'см. комментарий администрации'), 'Доработать', 'create.html?id=' + p.id)));
  visibleProjects().filter(p => p.status === 'signing' && !DB.hasSigned(p.id, acc.id)).slice(0, 2).forEach(p => tasks.push(
    task('✍️', '', 'Идёт сбор подписей', esc(p.title) + ' — ' + DB.signatures(p.id).length + ' из ' + p.signNeed, 'Подписать', 'project.html?id=' + p.id)));
  visibleProjects().filter(p => p.status === 'collecting').slice(0, 2).forEach(p => tasks.push(
    task('💳', '', 'Идёт сбор средств', esc(p.title) + ' — осталось ' + rub(DB.leftToRaise(p.id)), 'Поддержать', 'project.html?id=' + p.id)));

  const groups = [
    ['Черновики', mine.filter(p => p.status === 'draft')],
    ['Отправленные заявки', mine.filter(p => ['submitted', 'review', 'rework', 'approved', 'rejected'].includes(p.status))],
    ['Опубликованные проекты', mine.filter(p => ['signing', 'collecting', 'goal', 'documents', 'procurement', 'works', 'reporting'].includes(p.status))],
    ['Завершённые проекты', mine.filter(p => ['done', 'refunded'].includes(p.status))]
  ];

  body.innerHTML = kpi([
    [mine.length, plural(mine.length, 'ваш проект', 'ваших проекта', 'ваших проектов') + ' на платформе', 'b'],
    [rubShort(paid), 'вы вложили в проекты города', 'g'],
    [supported.length, plural(supported.length, 'поддержанный проект', 'поддержанных проекта', 'поддержанных проектов'), 'v'],
    [mySigns.length, plural(mySigns.length, 'подпись', 'подписи', 'подписей') + ' через ЕСИА', 'a']
  ]) + `
  <div class="grid g2" style="align-items:start">
    <div>
      ${notifCard(acc)}

      <div class="card">
        <div class="card-h"><h3>Требуют вашего действия</h3><span class="chip chip-amber">${tasks.length}</span></div>
        ${tasks.join('') || '<p class="muted">Всё в порядке: незавершённых действий нет.</p>'}
      </div>

      <div class="card">
        <div class="card-h"><h3>Мои проекты</h3>
          <a class="btn btn-p btn-s" href="create.html">+ Новый проект</a></div>
        ${groups.map(([name, list]) => fold(name, list.length,
          list.length ? `<div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Проект</th><th>Статус</th><th class="r">Смета</th><th></th></tr></thead>
            <tbody>${list.map(p => `<tr>
              <td><b>${plink(p)}</b><br><small class="muted">${esc(p.district)} · создан ${dateRU(p.createdAt)}</small></td>
              <td>${chip(p)}</td>
              <td class="r">${rub(p.cost)}</td>
              <td class="r"><a class="btn btn-o btn-s" href="${p.status === 'draft' || p.status === 'rework' ? 'create.html?id=' + p.id : 'project.html?id=' + p.id}">
                ${p.status === 'draft' || p.status === 'rework' ? 'Редактировать' : 'Открыть'}</a></td>
            </tr>`).join('')}</tbody></table></div>`
            : '<p class="muted" style="font-size:14px">Пусто.</p>',
          { open: list.length > 0 && list.length <= 4 })).join('')}
      </div>

      <div class="card" id="contribution">
        <div class="card-h"><h3>Ваш вклад</h3><span class="chip chip-green">${rub(paid)}</span></div>
        <p class="muted mb20">Раздел собирается из реальных записей: подписи, транзакции и проекты,
          в которых вы участвовали. Данные обновляются сразу после действия.</p>

        ${fold('Поддержанные проекты', supported.length, `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Проект</th><th>Ваше участие</th><th>Статус проекта</th><th class="r">Ваш взнос</th></tr></thead>
          <tbody>${supported.map(p => {
            const signed = DB.hasSigned(p.id, acc.id);
            const sum = myTx.filter(t => t.projectId === p.id && t.status === 'confirmed').reduce((s, t) => s + t.amount, 0);
            return `<tr>
              <td><b>${plink(p)}</b><br><small class="muted">${esc(p.district)}</small></td>
              <td>${signed ? '<span class="chip chip-violet">подпись</span> ' : ''}${sum ? '<span class="chip chip-green">взнос</span>' : ''}</td>
              <td>${chip(p)}</td>
              <td class="r strong">${sum ? rub(sum) : '—'}</td></tr>`;
          }).join('') || '<tr><td colspan="4" class="muted">Пока нет поддержанных проектов</td></tr>'}</tbody>
        </table></div>`, { open: true })}

        ${fold('Финансовый вклад: все транзакции', myTx.length, `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Транзакция</th><th>Проект</th><th>Дата</th><th class="r">Сумма</th><th>Статус</th><th>Документы</th></tr></thead>
          <tbody>${myTx.map(t => {
            const pr = DB.project(t.projectId);
            const s = TX_STATUS[t.status];
            return `<tr><td><code>${esc(t.no)}</code></td>
              <td>${pr ? plink(pr) : '—'}</td>
              <td>${dateTimeRU(t.date)}</td>
              <td class="r strong">${rub(t.amount)}</td>
              <td><span class="chip ${s[0]}">${s[1]}</span></td>
              <td><button class="btn btn-o btn-s" onclick="toast('Демо: открылся бы договор пожертвования и кассовый чек')">Договор и чек</button></td>
            </tr>`;
          }).join('') || '<tr><td colspan="6" class="muted">Взносов пока нет</td></tr>'}</tbody>
        </table></div>`, { hint: myTx.length ? 'нажмите, чтобы развернуть' : '' })}
        <div class="facts mt20">
          <div><span>Всего внесено (подтверждено)</span><b>${rub(paid)}</b></div>
          <div><span>Возвращено по нереализованным проектам</span><b>${rub(refunded)}</b></div>
          <div><span>Транзакций всего</span><b>${myTx.length}</b></div>
          <div><span>Подписей поставлено</span><b>${mySigns.length}</b></div>
        </div>
      </div>

      ${myIssues.length ? `<div class="card">
        <div class="card-h"><h3>Мои замечания по работам</h3><span class="chip chip-grey">${myIssues.length}</span></div>
        ${myIssues.map(i => {
          const pr = DB.project(i.projectId), s = ISSUE_STATUS[i.status];
          return `<div class="doc"><span class="ic ${i.status === 'published' ? 'ok' : 'wait'}">⚠️</span>
            <div class="tx"><b>${esc(i.text.slice(0, 80))}</b>
              <small>${pr ? esc(pr.title) : ''} · ${dateRU(i.date)} · фото: ${(i.photos || []).length}</small></div>
            <div class="act"><span class="chip ${s[0]}">${s[1]}</span></div></div>`;
        }).join('')}
      </div>` : ''}
    </div>

    <div>
      <div class="card">
        <h3 class="mb14">История просмотров</h3>
        <p class="muted mb14" style="font-size:13.5px">Проекты, которые вы открывали. Удобно вернуться
          к тому, что смотрели, и увидеть, как изменился статус.</p>
        ${views.map(v => {
          const p = DB.project(v.projectId);
          if (!p) return '';
          return `<div class="doc"><span class="ic">👁</span>
            <div class="tx"><b>${plink(p)}</b><small>${statusOf(p).n} · просмотрен ${dateTimeRU(v.lastSeen)}</small></div>
            <div class="act"><a class="btn btn-o btn-s" href="project.html?id=${p.id}">Открыть</a></div></div>`;
        }).join('') || '<p class="muted">Вы ещё не открывали проекты.</p>'}
      </div>
      <div class="card">
        <h3 class="mb14">Куда ещё вложиться</h3>
        ${visibleProjects().filter(p => p.status === 'collecting').map(p => `
          <div class="doc"><span class="ic">💳</span>
            <div class="tx"><b>${plink(p)}</b><small>осталось ${rub(DB.leftToRaise(p.id))} · ${DB.progress(p.id)}%</small></div>
            <div class="act"><a class="btn btn-p btn-s" href="project.html?id=${p.id}">Поддержать</a></div></div>`).join('')
          || '<p class="muted">Сейчас активных сборов нет.</p>'}
      </div>
    </div>
  </div>`;
}

/* ================= АДМИНИСТРАЦИЯ ================= */
if (acc.role === 'admin') {
  const all = DB.projects();
  const inbox = all.filter(p => ['submitted', 'review', 'rework'].includes(p.status));
  const collecting = all.filter(p => p.status === 'collecting');
  const goal = all.filter(p => p.status === 'goal');
  const docs = all.filter(p => p.status === 'documents');
  const proc = all.filter(p => p.status === 'procurement');
  const works = all.filter(p => ['works', 'reporting'].includes(p.status));
  const modIssues = DB.issuesByStatus('moderation');
  const sentReports = DB.all('reports').filter(r => r.status === 'sent');
  const raised = all.reduce((s, p) => s + DB.raised(p.id), 0);
  const newBids = DB.all('bids').filter(b => b.status === 'submitted' &&
    (DB.project(b.projectId) || {}).status === 'procurement');
  const ownProjects = all.filter(p => p.createdByRole === 'admin');
  const bizTx = DB.all('transactions').filter(t => t.payer === 'business' && t.status === 'confirmed');

  body.innerHTML = kpi([
    [inbox.length, plural(inbox.length, 'заявка ждёт', 'заявки ждут', 'заявок ждут') + ' проверки', 'v'],
    [newBids.length, plural(newBids.length, 'заявка подрядчика', 'заявки подрядчиков', 'заявок подрядчиков') + ' на торгах', 'b'],
    [modIssues.length, plural(modIssues.length, 'замечание', 'замечания', 'замечаний') + ' на модерации', 'r'],
    [sentReports.length, plural(sentReports.length, 'отчёт', 'отчёта', 'отчётов') + ' на приёмке', 'a']
  ]) + `
  <div class="grid g2" style="align-items:start">
    <div>
      ${notifCard(acc)}
      ${inbox.length ? `<div class="note note-a mb20" style="font-size:15px">
        <b>Новые заявки от жителей: ${inbox.length}.</b> Их нужно рассмотреть — проверить данные,
        сформировать смету и вынести решение. Заявки видны в реестре проектов со статусом
        «Заявка подана» / «На проверке», пока они не одобрены и не опубликованы.
      </div>` : ''}
      <div class="card" id="inbox">
        <div class="card-h"><h3>Заявки на рассмотрение</h3><span class="chip chip-amber">${inbox.length}</span></div>
        <p class="muted mb20">Заявки жителей: проверка данных, формирование сметы и решение —
          одобрить, вернуть на доработку или отклонить с обоснованием.</p>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Заявка</th><th>Автор и дата</th><th class="r">Стоимость</th><th></th></tr></thead>
          <tbody>${inbox.map(p => `<tr>
            <td><b>${plink(p)}</b><br><small class="muted">${esc(p.cat)} · ${esc(p.district)}${p.addr ? ' · ' + esc(p.addr) : ''}</small>
              <div class="mt8">${chip(p)}</div></td>
            <td>${esc(p.ownerName)}<br><small class="muted">${dateRU(p.createdAt)}</small></td>
            <td class="r strong">${rub(DB.smetaTotal(p.id))}<br><small class="muted">${p.smetaApproved ? 'смета утверждена' : 'смета не утверждена'}</small></td>
            <td class="r"><a class="btn btn-d btn-s" href="project.html?id=${p.id}">Рассмотреть</a></td>
          </tr>`).join('') || '<tr><td colspan="4" class="muted">Новых заявок нет</td></tr>'}</tbody>
        </table></div>
      </div>

      <div class="card" id="bids">
        <div class="card-h"><h3>Заявки подрядчиков на торгах</h3>
          <span class="chip ${newBids.length ? 'chip-blue' : 'chip-grey'}">${newBids.length}</span></div>
        <p class="muted mb20">Организации подают ценовые предложения по объектам, где объявлены торги.
          Платформа регистрирует заявку и сразу показывает её здесь; победителя выбирает администрация
          на странице торгов. Юридически значимая процедура остаётся в ЕИС по 44-ФЗ.</p>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Объект и участник</th><th class="r">Цена и снижение</th><th>Подана</th><th></th></tr></thead>
          <tbody>${newBids.map(b => {
            const pr = DB.project(b.projectId);
            const nmck = pr && pr.tender ? pr.tender.nmck : (pr ? pr.cost : 0);
            const dis = nmck ? Math.round((nmck - b.price) / nmck * 1000) / 10 : 0;
            return `<tr>
              <td><b>${pr ? plink(pr) : '—'}</b><br><small class="muted">${esc(b.contractorName)} · ИНН ${esc(b.inn || '—')}
                ${b.exp ? '<br>' + esc(b.exp) : ''}${b.fail ? ' · срывов: ' + b.fail : ''}</small></td>
              <td class="r strong">${rub(b.price)}<br><small class="muted">−${String(dis).replace('.', ',')}% к НМЦК</small></td>
              <td>${dateTimeRU(b.date)}</td>
              <td class="r"><a class="btn btn-d btn-s" href="tender.html?id=${b.projectId}">К торгам</a></td>
            </tr>`;
          }).join('') || '<tr><td colspan="4" class="muted">Новых заявок от подрядчиков нет</td></tr>'}</tbody>
        </table></div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Модерация замечаний жителей</h3><span class="chip chip-red">${modIssues.length}</span></div>
        ${modIssues.map(i => {
          const pr = DB.project(i.projectId);
          return `<div class="rep">
            <div class="between mb8"><b>${esc(i.userName)}</b>
              <span class="chip chip-amber">${dateTimeRU(i.date)}</span></div>
            <p class="mb14">${esc(i.text)}</p>
            <small class="muted">Проект: ${pr ? plink(pr) : '—'}</small>
            <div class="mt14">${photoGrid(i.photos)}</div>
            <div class="flexr mt14">
              <button class="btn btn-g btn-s" data-pub="${i.id}">Опубликовать</button>
              <button class="btn btn-o btn-s" data-rej="${i.id}">Отклонить</button>
            </div>
          </div>`;
        }).join('') || '<p class="muted">Замечаний на модерации нет.</p>'}
      </div>

      <div class="card">
        <div class="card-h"><h3>Отчёты подрядчиков на приёмке</h3><span class="chip chip-amber">${sentReports.length}</span></div>
        ${sentReports.map(r => {
          const pr = DB.project(r.projectId);
          return task('🏗️', 'wait', esc(r.stage) + ' — ' + esc(r.text.slice(0, 60)),
            (pr ? esc(pr.title) : '') + ' · работы ' + dateRU(r.workDate) + ', отчёт отправлен ' + dateTimeRU(r.sentAt) +
            ' · фото: ' + (r.photos || []).length + ', документов: ' + (r.docs || []).length,
            'Принять', 'project.html?id=' + r.projectId);
        }).join('') || '<p class="muted">Новых отчётов нет.</p>'}
      </div>

      <div class="card">
        <div class="card-h"><h3>Контроль сбора средств</h3><span class="chip chip-blue">п. 8.2 · 40 рабочих дней</span></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Проект</th><th class="r">Цель</th><th class="r">Собрано</th><th class="r">Осталось</th><th>Срок</th></tr></thead>
          <tbody>${collecting.concat(goal).map(p => `<tr>
            <td><b>${plink(p)}</b>
              <div class="bar ${DB.progress(p.id) >= 100 ? 'ok' : 'warn'}" style="margin-top:6px;max-width:200px"><i style="width:${DB.progress(p.id)}%"></i></div></td>
            <td class="r">${rub(p.goal)}</td>
            <td class="r strong">${rub(DB.raised(p.id))}</td>
            <td class="r" style="color:var(--red);font-weight:800">${rub(DB.leftToRaise(p.id))}</td>
            <td>${esc(p.deadline)}<br><small class="muted">${p.daysLeft ? days(p.daysLeft) : ''}</small></td>
          </tr>`).join('') || '<tr><td colspan="5" class="muted">Активных сборов нет</td></tr>'}</tbody>
        </table></div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Проекты администрации</h3>
          <div class="flexr"><span class="chip chip-grey">${ownProjects.length}</span>
            <a class="btn btn-p btn-s" href="create.html">+ Внести проект</a></div></div>
        <p class="muted mb20">Администрация может внести проект сама — например, по обращениям жителей
          или по итогам обхода территории. Такой проект проходит внутреннюю проверку и публикуется вручную.</p>
        ${ownProjects.length ? `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Проект</th><th>Статус</th><th class="r">Смета</th><th>Создан</th><th></th></tr></thead>
          <tbody>${ownProjects.map(p => `<tr>
            <td><b>${plink(p)}</b><br><small class="muted">${esc(p.district)} · ${esc(p.cat)}</small></td>
            <td>${chip(p)}</td><td class="r">${rub(p.cost)}</td><td>${dateRU(p.createdAt)}</td>
            <td class="r"><a class="btn btn-o btn-s" href="project.html?id=${p.id}">Открыть</a></td></tr>`).join('')}</tbody>
        </table></div>` : '<p class="muted">Проектов, внесённых администрацией, пока нет.</p>'}
      </div>

      <div class="card">
        <div class="card-h"><h3>Реестр проектов и финансы</h3><span class="chip chip-grey">${all.length}</span></div>
        ${fold('Все проекты города', all.length, `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Проект</th><th>Статус</th><th class="r">Смета</th><th class="r">Собрано</th><th>Инициатор</th></tr></thead>
          <tbody>${all.map(p => `<tr>
            <td><b>${plink(p)}</b><br><small class="muted">${esc(p.district)} · ${esc(p.cat)}</small></td>
            <td>${chip(p)}</td><td class="r">${rub(p.cost)}</td>
            <td class="r">${rub(DB.raised(p.id))}</td><td>${esc(p.ownerName)}</td></tr>`).join('')}</tbody>
        </table></div>`)}
        ${fold('Софинансирование от бизнеса', bizTx.length, `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Организация</th><th>Проект</th><th>Дата</th><th class="r">Сумма</th></tr></thead>
          <tbody>${bizTx.map(t => {
            const pr = DB.project(t.projectId);
            return `<tr><td><b>${esc(t.userName)}</b></td><td>${pr ? plink(pr) : '—'}</td>
              <td>${dateTimeRU(t.date)}</td><td class="r strong">${rub(t.amount)}</td></tr>`;
          }).join('') || '<tr><td colspan="4" class="muted">Взносов от организаций пока нет</td></tr>'}</tbody>
        </table></div>
        <div class="note note-b mt14">Юридические лица вправе вносить инициативные платежи наравне
          с жителями (ст. 70 ФЗ-33). Деньги идут тем же маршрутом — в бюджет города, на конкретный проект.
          Участие в софинансировании не даёт преимуществ на торгах.</div>`,
          { chip: bizTx.length ? 'chip-green' : 'chip-grey' })}
        ${fold('Все транзакции платформы', DB.all('transactions').length, `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Транзакция</th><th>Проект</th><th>Плательщик</th><th>Дата</th><th class="r">Сумма</th><th>Статус</th></tr></thead>
          <tbody>${DB.all('transactions').slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 60).map(t => {
            const pr = DB.project(t.projectId), s = TX_STATUS[t.status] || ['chip-grey', t.status];
            return `<tr><td><code>${esc(t.no)}</code></td><td>${pr ? plink(pr) : '—'}</td>
              <td>${esc(t.userName)}${t.payer === 'business' ? ' <span class="chip chip-violet">юрлицо</span>' : ''}</td>
              <td>${dateTimeRU(t.date)}</td><td class="r strong">${rub(t.amount)}</td>
              <td><span class="chip ${s[0]}">${s[1]}</span></td></tr>`;
          }).join('')}</tbody></table></div>`,
          { hint: 'последние 60 записей' })}
      </div>
    </div>

    <div>
      <div class="card">
        <h3 class="mb14">Сводка по городу</h3>
        <div class="facts">
          <div><span>Проектов в реестре</span><b>${all.length}</b></div>
          <div><span>Собрано жителями</span><b>${rubShort(raised)}</b></div>
          <div><span>Подписей</span><b>${DB.all('signatures').length}</b></div>
          <div><span>Транзакций</span><b>${DB.all('transactions').length}</b></div>
          <div><span>Торгов открыто</span><b>${proc.length}</b></div>
          <div><span>Объектов в работе</span><b>${works.length}</b></div>
        </div>
        <button class="btn btn-d btn-full mt20" onclick="toast('Демо: выгружен пакет XLSX для отчётности в Минфин области')">Выгрузить отчётность</button>
      </div>

      <div class="card">
        <h3 class="mb14">Следующие шаги</h3>
        ${goal.map(p => task('📦', 'wait', 'Цель достигнута — сформировать пакет', esc(p.title), 'Открыть', 'project.html?id=' + p.id)).join('')}
        ${docs.map(p => task('📨', 'wait', 'Принять пакет документов', esc(p.title) + (p.docsPack ? ' · ' + esc(p.docsPack.incoming) : ''), 'Открыть', 'project.html?id=' + p.id)).join('')}
        ${proc.map(p => task('📑', '', 'Выбрать победителя торгов', esc(p.title) + ' · заявок: ' + DB.bids(p.id).length, 'К торгам', 'tender.html?id=' + p.id)).join('')}
        ${works.map(p => task('🏗️', '', 'Контроль работ', esc(p.title) + ' · выполнено ' + DB.worksProgress(p.id) + '%', 'Открыть', 'project.html?id=' + p.id)).join('')}
        ${(goal.length + docs.length + proc.length + works.length) === 0 ? '<p class="muted">Активных задач нет.</p>' : ''}
      </div>
    </div>
  </div>`;

  document.querySelectorAll('[data-pub]').forEach(b => b.addEventListener('click', () => {
    DB.moderateIssue(b.dataset.pub, 'published', 'Замечание передано подрядчику для устранения.');
    toast('Замечание опубликовано'); setTimeout(() => location.reload(), 700);
  }));
  document.querySelectorAll('[data-rej]').forEach(b => b.addEventListener('click', () => {
    DB.moderateIssue(b.dataset.rej, 'rejected', 'Замечание не относится к предмету контракта.');
    toast('Замечание отклонено'); setTimeout(() => location.reload(), 700);
  }));
}

/* ================= ПОДРЯДЧИК ================= */
if (acc.role === 'contractor') {
  const myBids = DB.bidsByContractor(acc.id);
  const myProjects = DB.projects().filter(p => p.contract && p.contract.contractorId === acc.id);
  const active = myProjects.filter(p => ['works', 'reporting'].includes(p.status));
  const myReports = DB.reportsByContractor(acc.id);
  const openTenders = DB.projects().filter(p => p.status === 'procurement');
  const sum = myProjects.reduce((s, p) => s + p.contract.sum, 0);
  const issues = active.reduce((s, p) => s + DB.issues(p.id, { published: true }).length, 0);

  body.innerHTML = kpi([
    [myProjects.length, plural(myProjects.length, 'контракт', 'контракта', 'контрактов') + ' на платформе', 'b'],
    [rubShort(sum), 'общая цена контрактов', 'g'],
    [myReports.length, plural(myReports.length, 'отчёт отправлен', 'отчёта отправлено', 'отчётов отправлено'), 'a'],
    [issues, plural(issues, 'замечание', 'замечания', 'замечаний') + ' от жителей', 'r']
  ]) + `
  <div class="grid g2" style="align-items:start">
    <div>
      ${notifCard(acc)}

      <div class="card">
        <div class="card-h"><h3>Мои контракты</h3><span class="chip chip-grey">${myProjects.length}</span></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Объект и контракт</th><th class="r">Цена</th><th class="r">Готовность</th><th></th></tr></thead>
          <tbody>${myProjects.map(p => `<tr>
            <td><b>${plink(p)}</b><br><small class="muted">${esc(p.district)} · ${esc(p.contract.number)} · оплачено ${rub(p.contract.paid)}</small>
              <div class="mt8">${chip(p)}</div></td>
            <td class="r strong">${rub(p.contract.sum)}</td>
            <td class="r" style="min-width:110px">
              <div class="bar ${DB.worksProgress(p.id) === 100 ? 'ok' : 'warn'}"><i style="width:${DB.worksProgress(p.id)}%"></i></div>
              <small class="muted">${DB.worksProgress(p.id)}%</small></td>
            <td class="r"><a class="btn btn-o btn-s" href="project.html?id=${p.id}">Открыть</a></td>
          </tr>`).join('') || '<tr><td colspan="4" class="muted">Контрактов пока нет — подайте заявку на торгах</td></tr>'}</tbody>
        </table></div>
      </div>

      ${active.map(p => `<div class="card">
        <div class="card-h"><h3>Что сделать: ${esc(p.title)}</h3>
          <span class="chip chip-amber">${DB.worksProgress(p.id)}%</span></div>
        ${task('📸', 'wait', 'Отправить отчёт по текущему этапу',
          (p.plan_items.find(i => i.st === 'now') || { t: 'текущий этап' }).t +
          ' · дата отправки фиксируется системой', 'Открыть', 'project.html?id=' + p.id)}
        ${DB.issues(p.id, { published: true }).map(i => task('⚠️', 'wait', 'Замечание: ' + esc(i.text.slice(0, 60)),
          dateRU(i.date) + ' · ' + esc(i.userName) + (i.adminComment ? ' · ' + esc(i.adminComment) : ''),
          'Открыть', 'project.html?id=' + p.id)).join('')}
      </div>`).join('')}

      <div class="card" id="support">
        <div class="card-h"><h3>Поддержать проект города</h3><span class="chip chip-violet">софинансирование</span></div>
        <p class="muted mb20">Организация вправе внести инициативный платёж наравне с жителями
          (ст. 70 ФЗ-33): деньги идут в бюджет города на конкретный проект. Это не влияет на торги
          и не даёт преимуществ при отборе подрядчика — но ускоряет сбор и видно жителям в карточке проекта.</p>
        ${DB.projects().filter(p => ['collecting', 'signing'].includes(p.status)).map(p => {
          const left = DB.leftToRaise(p.id), pr = DB.progress(p.id);
          return `<div class="doc"><span class="ic">🏢</span>
            <div class="tx"><b>${plink(p)}</b>
              <small>${esc(p.district)} · ${p.status === 'collecting'
                ? 'собрано ' + pr + '%, осталось ' + rub(left)
                : 'идёт сбор подписей, сбор средств откроется после'}</small></div>
            <div class="act"><a class="btn btn-${p.status === 'collecting' ? 'p' : 'o'} btn-s" href="project.html?id=${p.id}">
              ${p.status === 'collecting' ? 'Внести взнос' : 'Открыть'}</a></div></div>`;
        }).join('') || '<p class="muted">Сейчас активных сборов нет.</p>'}
        ${(() => {
          const my = DB.txByUser(acc.id).filter(t => t.status === 'confirmed');
          const sumB = my.reduce((s, t) => s + t.amount, 0);
          return my.length ? fold('Наши взносы', my.length, `<div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Транзакция</th><th>Проект</th><th>Дата</th><th class="r">Сумма</th></tr></thead>
            <tbody>${my.map(t => { const pr = DB.project(t.projectId);
              return `<tr><td><code>${esc(t.no)}</code></td><td>${pr ? plink(pr) : '—'}</td>
                <td>${dateTimeRU(t.date)}</td><td class="r strong">${rub(t.amount)}</td></tr>`; }).join('')}</tbody>
            </table></div><div class="facts mt14"><div><span>Всего внесено организацией</span><b>${rub(sumB)}</b></div></div>`,
            { chip: 'chip-green', open: true }) : '';
        })()}
      </div>

      <div class="card">
        <div class="card-h"><h3>Мои отчёты</h3><span class="chip chip-grey">${myReports.length}</span></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Объект и этап</th><th>Работы / отправлен</th><th class="r">Файлы</th><th>Статус</th></tr></thead>
          <tbody>${myReports.slice(0, 12).map(r => {
            const pr = DB.project(r.projectId);
            const s = { sent: ['chip-blue', 'ждёт приёмки'], accepted: ['chip-green', 'принят'], returned: ['chip-red', 'возвращён'] }[r.status] || ['chip-grey', r.status];
            return `<tr><td><b>${pr ? plink(pr) : '—'}</b><br><small class="muted">${esc(r.stage)}</small></td>
              <td>${dateRU(r.workDate)}<br><small class="muted">отправлен ${dateTimeRU(r.sentAt)}</small></td>
              <td class="r">${(r.photos || []).length} фото<br><small class="muted">${(r.docs || []).length} док.</small></td>
              <td><span class="chip ${s[0]}">${s[1]}</span></td></tr>`;
          }).join('') || '<tr><td colspan="4" class="muted">Отчётов пока нет</td></tr>'}</tbody>
        </table></div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Открытые торги</h3><span class="chip chip-blue">44-ФЗ</span></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Объект и извещение</th><th class="r">НМЦК</th><th>Моя заявка</th><th></th></tr></thead>
          <tbody>${openTenders.map(p => {
            const mine = myBids.find(b => b.projectId === p.id);
            return `<tr><td><b>${esc(p.title)}</b><br><small class="muted">${esc(p.district)} · ${esc(p.tender ? p.tender.number : '—')}<br>приём заявок: ${esc(p.tender ? p.tender.bidsUntil : '—')}</small></td>
              <td class="r strong">${rub(p.tender ? p.tender.nmck : p.cost)}</td>
              <td>${mine ? '<span class="chip chip-green">подана · ' + rub(mine.price) + '</span>' : '<span class="chip chip-grey">не подана</span>'}</td>
              <td class="r"><a class="btn btn-${mine ? 'o' : 'p'} btn-s" href="tender.html?id=${p.id}">${mine ? 'Открыть' : 'Принять участие'}</a></td></tr>`;
          }).join('') || '<tr><td colspan="4" class="muted">Открытых торгов сейчас нет</td></tr>'}</tbody>
        </table></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h3 class="mb14">Репутация на платформе</h3>
        <div class="facts">
          <div><span>Исполнено контрактов</span><b>${acc.done || 0}</b></div>
          <div><span>Срывов срока</span><b>${acc.fail || 0}</b></div>
          <div><span>Средняя оценка жителей</span><b>${String(acc.rating || 0).replace('.', ',')} из 5</b></div>
          <div><span>Заявок на торгах</span><b>${myBids.length}</b></div>
          <div><span>Побед</span><b>${myBids.filter(b => b.status === 'winner').length}</b></div>
        </div>
        <div class="note note-g mt20">Репутация видна жителям в карточке торгов — это ответ
          на вопрос «кто будет делать наш проект».</div>
      </div>
      <div class="card">
        <h3 class="mb14">Ближайшие сроки</h3>
        ${active.map(p => `<div class="doc"><span class="ic wait">📅</span>
          <div class="tx"><b>${esc(p.contract.finish)}</b><small>${esc(p.title)} · сдача объекта</small></div></div>`).join('')
          || '<p class="muted">Активных объектов нет.</p>'}
      </div>
    </div>
  </div>`;
}


bindNotif();
}
</script>
</body>
</html>
