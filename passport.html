<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Паспорт проекта · ЭИБ Обнинск</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2312275C'/%3E%3Cg fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M24 6 39 14.5v17L24 40 9 31.5v-17z' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M15 28v6.5a2.4 2.4 0 0 0 2.4 2.4h13.2a2.4 2.4 0 0 0 2.4-2.4V28' stroke='%23ffffff' stroke-width='2'/%3E%3Cpath d='M15 28h4M29 28h4' stroke='%23ffffff' stroke-width='2'/%3E%3Cg transform='rotate(-16 24 19)'%3E%3Crect x='20' y='11' width='8.4' height='16' rx='1.4' fill='%23ffffff'/%3E%3Cpath d='m21.9 19 2.1 2.2 4-5.4' stroke='%23E32C26' stroke-width='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body{background:#EDF0F6}
  .toolbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:12px 0}
  .toolbar-in{max-width:210mm;margin:0 auto;padding:0 10mm;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sheet{max-width:210mm;margin:22px auto;background:#fff;padding:16mm 14mm;box-shadow:var(--shadow);border-radius:6px}

  .ps-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
    border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:20px}
  .ps-head .logo-mark{width:52px;height:52px}
  .ps-title{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .ps-head h1{font-size:24px;margin-top:6px;letter-spacing:-.01em}
  .ps-num{text-align:right;font-size:12px;color:var(--muted);line-height:1.7;white-space:nowrap}
  .ps-num b{display:block;color:var(--ink);font-size:14px}

  .ps-sec{margin-top:18px;break-inside:avoid}
  .ps-sec h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);
    border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
  .ps-rows{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  .ps-row{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:13px}
  .ps-row span{color:var(--muted)}
  .ps-row b{text-align:right;font-weight:700}
  .ps-text{font-size:13px;line-height:1.55}
  .ps-text p+p{margin-top:8px}
  .ps-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0}
  .ps-tbl th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    border-bottom:1.5px solid var(--line);padding:0 8px 6px}
  .ps-tbl td{padding:7px 8px;border-bottom:1px solid var(--line)}
  .ps-tbl .r{text-align:right}
  .ps-tbl tr.sum td{background:var(--bg-2);font-weight:800;border-bottom:none}
  .ps-steps{display:flex;flex-wrap:wrap;gap:6px}
  .ps-step{font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;background:var(--bg-2);color:var(--muted)}
  .ps-step.done{background:var(--green-soft);color:#0B7A45}
  .ps-step.now{background:var(--navy);color:#fff}

  .ps-sign{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px;break-inside:avoid}
  .ps-sign div{font-size:12px;color:var(--muted)}
  .ps-sign .line{border-bottom:1px solid #93A0BA;height:32px;margin-bottom:6px}
  .ps-foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:20px;align-items:flex-end;font-size:11px;color:var(--muted)}
  .ps-qr{width:96px;height:96px;flex:none;border:1px solid var(--line);border-radius:6px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
  .ps-qr canvas,.ps-qr img{width:100%;height:100%}
  .ps-qr small{font-size:9px;text-align:center;padding:6px;color:var(--muted)}

  @media (max-width:820px){
    .sheet{margin:12px;padding:18px;max-width:none}
    .ps-rows{grid-template-columns:1fr}
    .ps-head{flex-direction:column;gap:12px}
    .ps-num{text-align:left;white-space:normal}
    .ps-sign{grid-template-columns:1fr}
    .ps-foot{flex-direction:column-reverse;align-items:flex-start;gap:14px}
    .ps-tbl{font-size:12px}
    .ps-tbl td,.ps-tbl th{padding-left:4px;padding-right:4px}
    .ps-head h1{font-size:20px}
  }

  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff}
    .toolbar,.demo-bar,.toast{display:none !important}
    .sheet{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}
    .ps-sec{break-inside:avoid}
    a{color:inherit}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-in">
    <a class="btn btn-o btn-s" href="#" id="back">← К карточке проекта</a>
    <a class="btn btn-o btn-s" href="projects.html">Все проекты</a>
    <button class="btn btn-p btn-s" onclick="window.print()" style="margin-left:auto">🖨 Печать / Сохранить в PDF</button>
  </div>
</div>

<div class="sheet" id="sheet"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const id = param('id');
const p = DB.project(id);
if (!p) location.href = 'projects.html';
document.getElementById('back').href = 'project.html?id=' + p.id;

const st = statusOf(p);
const total = DB.smetaTotal(p.id);
const raised = DB.raised(p.id);
const bids = DB.bids(p.id);
const win = bids.find(b => b.status === 'winner');
const reports = DB.reports(p.id);
const issues = DB.issues(p.id, { published: true });
const today = new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });
const row = (k, v) => '<div class="ps-row"><span>' + k + '</span><b>' + v + '</b></div>';

const docRows = (p.docs || []).map(d =>
  '<tr><td>' + esc(d.name) + '</td><td>' + esc(d.by) + '</td><td class="r">' + esc(d.date) + '</td></tr>').join('');

const tenderBlock = (p.tender || bids.length) ? `
  <div class="ps-sec">
    <h2>Закупка (44-ФЗ)</h2>
    <div class="ps-rows">
      ${row('Извещение', esc(p.tender ? p.tender.number : '—'))}
      ${row('Способ', esc(p.tender ? p.tender.law : 'электронный аукцион'))}
      ${row('НМЦК', rub(p.tender ? p.tender.nmck : p.cost))}
      ${row('Заявок подано', bids.length)}
      ${row('Победитель', win ? esc(win.contractorName) : '—')}
      ${row('Цена контракта', win ? rub(win.price) : '—')}
    </div>
  </div>` : '';

const worksBlock = p.contract ? `
  <div class="ps-sec">
    <h2>Подрядчик и ход работ</h2>
    <div class="ps-rows">
      ${row('Подрядчик', esc((DB.user(p.contract.contractorId) || {}).name || '—'))}
      ${row('Контракт', esc(p.contract.number))}
      ${row('Цена контракта', rub(p.contract.sum))}
      ${row('Оплачено по актам', rub(p.contract.paid))}
      ${row('Сроки работ', esc(p.contract.start) + ' — ' + esc(p.contract.finish))}
      ${row('Выполнено', DB.worksProgress(p.id) + '%')}
      ${row('Отчётов подрядчика', reports.length)}
      ${row('Замечаний жителей', issues.length)}
    </div>
  </div>` : '';

const reportBlock = p.report ? `
  <div class="ps-sec">
    <h2>Итоги реализации</h2>
    <div class="ps-rows">
      ${row('Объект открыт', esc(p.report.openedAt))}
      ${row('Отчёт опубликован', esc(p.report.published))}
      ${row('Вложили жители', rub(p.report.citizens))}
      ${row('Бюджет города', rub(p.report.cityBudget))}
      ${row('Субсидия области', rub(p.report.regionSubsidy))}
      ${row('Экономия на торгах', rub(p.report.rest))}
      ${row('Возвращено плательщикам', rub(p.report.restBack))}
      ${row('Оценка жителей', String(p.report.rating).replace('.', ',') + ' из 5')}
    </div>
  </div>` : '';

const stepsHtml = PHASES.map((f, i) => {
  const cur = phaseIndex(phaseOf(p));
  return '<span class="ps-step ' + (i < cur ? 'done' : (i === cur ? 'now' : '')) + '">' +
    f.n + '. ' + f.name + (i < cur ? ' ✓' : '') + '</span>';
}).join('');

const smetaRows = (p.smeta || []).map(i =>
  '<tr><td>' + esc(i.t) + '</td><td class="r">' + fmt(i.q) + ' ' + esc(i.unit || '') +
  '</td><td class="r">' + fmt(i.u) + '</td><td class="r">' + fmt(i.q * i.u) + '</td></tr>').join('');

document.getElementById('sheet').innerHTML = `
  <div class="ps-head">
    <div style="display:flex;gap:14px;align-items:flex-start">
      <span class="logo-mark">${logoMark()}</span>
      <div>
        <div class="ps-title">Паспорт инициативного проекта · ${CITY.name}</div>
        <h1>${esc(p.title)}</h1>
        <div class="ps-text muted" style="margin-top:6px">${esc(p.cat)} · ${esc(p.district)} · ${esc(p.addr)}</div>
      </div>
    </div>
    <div class="ps-num">
      <b>№ ИБ-${CITY.year}-${String(DB.projects().findIndex(x => x.id === p.id) + 1).padStart(3, '0')}</b>
      Сформирован ${today}<br>Статус: ${st.n}
    </div>
  </div>

  <div class="ps-sec">
    <h2>Этапы проекта</h2>
    <div class="ps-steps">${stepsHtml}</div>
  </div>

  <div class="ps-sec">
    <h2>Общие сведения</h2>
    <div class="ps-rows">
      ${row('Инициатор', esc(p.ownerName))}
      ${row('Инициативная группа', DB.signatures(p.id).length + ' подписей (норма — ' + p.signNeed + ')')}
      ${row('Заявка создана', dateRU(p.createdAt))}
      ${row('Категория', esc(p.cat))}
      ${row('Территория', esc(p.district))}
      ${row('Смета утверждена', p.smetaApproved ? 'да' : 'нет')}
    </div>
  </div>

  <div class="ps-sec">
    <h2>Обоснование</h2>
    <div class="ps-text">
      ${p.idea ? '<p><b>Идея жителя.</b> ' + esc(p.idea) + '</p>' : ''}
      <p><b>Проблема.</b> ${esc(p.problem)}</p>
      <p><b>Результат.</b> ${esc(p.result)}</p>
    </div>
  </div>

  <div class="ps-sec">
    <h2>Финансирование</h2>
    <div class="ps-rows">
      ${row('Стоимость проекта', rub(p.cost))}
      ${row('Лимит проекта в ' + CITY.name + 'е', rub(CITY.limit))}
      ${row('Доля жителей', p.sharePct + '% · ' + rub(p.goal))}
      ${row('Собрано жителями', rub(raised) + ' (' + DB.progress(p.id) + '%)')}
      ${row('Плательщиков', DB.donors(p.id))}
      ${row('Осталось собрать', rub(DB.leftToRaise(p.id)))}
      ${row('Подтверждённых транзакций', DB.tx(p.id).filter(t => t.status === 'confirmed').length)}
      ${row('Срок сбора по договору', esc(p.deadline))}
    </div>
  </div>

  <div class="ps-sec">
    <h2>Смета</h2>
    <table class="ps-tbl">
      <thead><tr><th>Статья расходов</th><th class="r">Кол-во</th><th class="r">Цена, ₽</th><th class="r">Сумма, ₽</th></tr></thead>
      <tbody>
        ${smetaRows}
        <tr class="sum"><td colspan="3">Итого по смете</td><td class="r">${fmt(total)}</td></tr>
      </tbody>
    </table>
  </div>

  ${tenderBlock}
  ${worksBlock}
  ${reportBlock}

  <div class="ps-sec">
    <h2>Документы проекта</h2>
    <table class="ps-tbl">
      <thead><tr><th>Документ</th><th>Кто формирует</th><th class="r">Дата</th></tr></thead>
      <tbody>${docRows || '<tr><td colspan="3">Документы ещё не сформированы</td></tr>'}</tbody>
    </table>
  </div>

  <div class="ps-sign">
    <div><div class="line"></div>Руководитель инициативной группы · ${esc(p.ownerName)}</div>
    <div><div class="line"></div>Куратор проекта, администрация г. ${CITY.name}а</div>
  </div>

  <div class="ps-foot">
    <div style="max-width:400px">
      Документ сформирован платформой ЭИБ автоматически из данных проекта.<br>
      Актуальный статус, документы и фотоотчёт — на карточке проекта:<br>
      <b id="lnk"></b><br><br>
      Правовая основа: ст. 49 и 70 ФЗ № 33-ФЗ, Положение г. ${CITY.name}а № 05-22,
      закупка — 44-ФЗ. Персональные данные плательщиков не публикуются (152-ФЗ).
    </div>
    <div class="ps-qr" id="qr"><small>QR-код<br>карточки проекта</small></div>
  </div>`;

const url = location.origin + location.pathname.replace('passport.html', 'project.html') + '?id=' + p.id;
document.getElementById('lnk').textContent = url;
if (typeof QRCode !== 'undefined') {
  const box = document.getElementById('qr');
  box.innerHTML = '';
  new QRCode(box, { text: url, width: 96, height: 96, colorDark: '#12275C', colorLight: '#ffffff' });
}
</script>
</body>
</html>
